# Ios mobile forensics — physically isolated backend, evidence store and worker queues.
# From repo root:
#   docker compose -f services/mobile-ios/docker-compose.yml --project-directory . up -d --build
name: aetheris-mobile-ios

x-gpu: &gpu
  driver: nvidia
  count: 1
  capabilities: [gpu]

x-mobile-env: &mobile-env
  AETHERIS_SERVICE: mobile-ios
  VULN_MODULE_ENABLED: "false"
  DATABASE_URL: postgresql+psycopg2://ios_forensic:ios_forensic@postgres:5432/ios_forensic
  REDIS_URL: redis://redis:6379/0
  # Shared leases only. Job state/evidence NEVER enters this Redis.
  RESOURCE_GOVERNOR_ENABLED: ${RESOURCE_GOVERNOR_ENABLED:-true}
  RESOURCE_GOVERNOR_REDIS_URL: ${RESOURCE_GOVERNOR_REDIS_URL:-redis://host.docker.internal:6389/0}
  RESOURCE_GOVERNOR_GROUP: ${RESOURCE_GOVERNOR_GROUP:-aetheris-host}
  RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE: ${RESOURCE_GOVERNOR_FAIL_OPEN_ON_UNAVAILABLE:-true}
  RESOURCE_GOVERNOR_CPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_CPU_MAX_SLOTS:-10}
  RESOURCE_GOVERNOR_GPU_MAX_SLOTS: ${RESOURCE_GOVERNOR_GPU_MAX_SLOTS:-4}
  GPU_RELEASE_MODEL_AFTER_TASK: ${GPU_RELEASE_MODEL_AFTER_TASK:-true}
  DB_POOL_SIZE: ${MOBILE_WORKER_DB_POOL_SIZE:-2}
  DB_MAX_OVERFLOW: ${MOBILE_WORKER_DB_MAX_OVERFLOW:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: mobile-ios
  HOST_EVIDENCE_ENABLED: ${HOST_EVIDENCE_ENABLED:-true}
  HOST_DRIVE_HELPER_URL: ${HOST_DRIVE_HELPER_URL:-http://host.docker.internal:9876}
  DATA_ROOT: /app/data
  AETHERIS_WORKER: "1"
  IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "0"
  EXTRACT_MODE: mobile
  EXTRACT_MOBILE_WORKERS: ${EXTRACT_MOBILE_WORKERS:-12}
  EXTRACT_SHARD_COUNT: ${EXTRACT_SHARD_COUNT:-12}
  # Product-local ceiling; host-wide adaptive semaphore may reduce this live.
  MAX_CONCURRENT_DISK_BUILDS: ${MOBILE_MAX_CONCURRENT_BUILDS:-4}
  PIPELINE_SUPERVISOR_ENABLED: "true"
  PHASE3_AUTO_AFTER_DISK: "true"
  LONG_JOB_TIMEOUT_SEC: ${LONG_JOB_TIMEOUT_SEC:-0}
  DYNAMIC_PERF_ENABLED: ${DYNAMIC_PERF_ENABLED:-true}
  DYNAMIC_PERF_FORCE: ${DYNAMIC_PERF_FORCE:-true}
  AETHERIS_SHARE_HOST: ${AETHERIS_SHARE_HOST:-true}
  GPU_THERMAL_ENABLED: ${GPU_THERMAL_ENABLED:-true}
  GPU_THERMAL_THROTTLE_C: ${GPU_THERMAL_THROTTLE_C:-87}
  GPU_THERMAL_PAUSE_C: ${GPU_THERMAL_PAUSE_C:-92}
  GPU_THERMAL_RESUME_C: ${GPU_THERMAL_RESUME_C:-84}
  GPU_THERMAL_ABORT_C: ${GPU_THERMAL_ABORT_C:-94}
  GPU_HEAVY_MAX_CONCURRENT: ${GPU_HEAVY_MAX_CONCURRENT:-2}
  CPU_THERMAL_THROTTLE_C: ${CPU_THERMAL_THROTTLE_C:-86}
  CPU_THERMAL_PAUSE_C: ${CPU_THERMAL_PAUSE_C:-94}
  OCR_ENABLED: "true"
  OCR_DEVICE: cuda
  OCR_GPU_ONLY: "true"
  OCR_PARALLEL_BUCKETS: "0"
  OCR_ENGINE: ${OCR_ENGINE:-glm-ocr}
  OCR_MODEL: ${OCR_MODEL:-zai-org/GLM-OCR}
  RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cuda}
  RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-24}
  RAG_BATCH_SIZE_CAP: ${RAG_BATCH_SIZE_CAP:-48}
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

x-app-common: &app-common
  image: aetheris-mobile-ios-app
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
  env_file:
    - .env
  environment:
    <<: *mobile-env
  gpus: all
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend:/app
    - ./scripts:/scripts:ro
    - ${IOS_HOST_EVIDENCE_PATH:-./evidence/ios}:/evidence:ro
    - ./data/mobile-ios:/app/data
    - ios_hf_cache:/root/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ios_forensic
      POSTGRES_PASSWORD: ios_forensic
      POSTGRES_DB: ios_forensic
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - ios_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ios_forensic -d ios_forensic"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6392:6379"
    volumes:
      - ios_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9040:9000"
      - "127.0.0.1:9041:9001"
    volumes:
      - ios_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nvidia-cuda:
    image: nvidia/cuda:12.6.3-base-ubuntu24.04
    command: ["sh", "-c", "nvidia-smi -L && echo CUDA_OK && exec sleep infinity"]
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    <<: *app-common
    environment:
      <<: *mobile-env
      DB_POOL_SIZE: ${MOBILE_API_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${MOBILE_API_DB_MAX_OVERFLOW:-10}
      APP_BASE_URL: http://localhost:3004
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-superadmin@admin.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin@123456789}
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - ./migrations:/migrations
      - ${IOS_HOST_EVIDENCE_PATH:-./evidence/ios}:/evidence:ro
      - ./data/mobile-ios:/app/data
      - ios_hf_cache:/root/.cache/huggingface
    command: >
      sh -c "alembic upgrade head 2>/dev/null || true &&
             python /scripts/ensure_sql_functions.py &&
             python /scripts/bootstrap_platform_admin.py &&
             uvicorn app.main_mobile_ios:app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  worker-build:
    <<: *app-common
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_BUILD_CONCURRENCY:-5}", "--prefetch-multiplier=1", "-Q", "ios-build"]

  # Parse pool is independent from image extraction so parse backlog cannot
  # starve new ios acquisitions/builds.
  worker-parse:
    <<: *app-common
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_PARSE_CONCURRENCY:-4}", "--prefetch-multiplier=1", "-Q", "ios-parse"]

  worker-rag:
    <<: *app-common
    environment:
      <<: *mobile-env
      OCR_ENABLED: "false"
      RAG_CUDA_MEMORY_FRACTION: ${RAG_CUDA_MEMORY_FRACTION:-0.35}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo", "--prefetch-multiplier=1", "-Q", "ios-rag"]

  worker-ocr:
    <<: *app-common
    environment:
      <<: *mobile-env
      OCR_CELERY_CONCURRENCY: "1"
      OCR_BATCH_LIMIT: ${OCR_BATCH_LIMIT:-32}
      OCR_CUDA_MEMORY_FRACTION: ${OCR_CUDA_MEMORY_FRACTION:-0.45}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo", "--prefetch-multiplier=1", "-Q", "ios-ocr"]

  worker-report:
    <<: *app-common
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "worker", "--loglevel=info", "--concurrency=${MOBILE_REPORT_CONCURRENCY:-2}", "--prefetch-multiplier=1", "-Q", "ios-report"]

  worker-beat:
    <<: *app-common
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}
      nvidia-cuda: {condition: service_healthy}
    entrypoint: ["python", "/scripts/dynamic_perf_entrypoint.py"]
    command: ["celery", "-A", "app.celery_mobile_ios.celery", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-ios"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AETHERIS_SERVICE: mobile-ios
        VITE_VULN_MODULE_ENABLED: "false"
    ports:
      - "3004:80"
    depends_on:
      api: {condition: service_healthy}

volumes:
  ios_pgdata:
  ios_redis:
  ios_minio:
  ios_hf_cache:
